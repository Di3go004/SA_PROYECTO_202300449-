# redis/redis.conf
# Caché de consultas frecuentes del catálogo y de tendencias (Proyecto Fase 1).

bind 0.0.0.0
protected-mode no
port 6379

# ── Política de memoria ──────────────────────────────────────
# Como Redis acá es exclusivamente una caché (el dato original siempre está en
# MySQL), se le pone un techo de memoria y se descarta lo menos usado al
# llenarse, en vez de dejar que el proceso crezca sin límite.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistencia ─────────────────────────────────────────────
# Se desactiva a propósito: perder la caché en un reinicio no pierde información,
# solo obliga a recalcular. Guardar en disco costaría E/S sin beneficio real.
save ""
appendonly no

# ── Registro ─────────────────────────────────────────────────
loglevel notice
