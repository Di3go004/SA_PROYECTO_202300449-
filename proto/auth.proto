syntax = "proto3";
package auth;
option go_package = "./proto";

// Contrato gRPC unificado del microservicio de Autenticación/Identidades/Roles (TypeScript/NestJS).
// Único consumidor: api-gateway. Login/Register/Logout son operaciones públicas (el gateway
// no exige JWT previo); el resto exige rol administrador y viaja con metadata "authorization".
service AuthService {
  rpc Register    (RegisterRequest)    returns (MessageResponse);
  rpc Login       (LoginRequest)       returns (LoginResponse);
  rpc Logout      (LogoutRequest)      returns (MessageResponse);
  rpc GetAllUsers (Empty)              returns (JsonResponse);
  rpc GetUserById (GetUserByIdRequest) returns (JsonResponse);
  rpc AssignRole  (AssignRoleRequest)  returns (MessageResponse);
  rpc ToggleBlock (ToggleBlockRequest) returns (MessageResponse);

  // ── Panel administrativo (Práctica 3) ──────────────────────────────────
  // GetRoles alimenta el selector de roles del panel (hasta ahora el frontend
  // tenía los ids hardcodeados). ListTeachers devuelve los usuarios con rol
  // catedratico/auxiliar: son los "Docentes" que administra el panel y los
  // candidatos a asignarse a un curso, que vive en la otra base de datos.
  rpc GetRoles     (Empty) returns (JsonResponse);
  rpc ListTeachers (Empty) returns (JsonResponse);

  // Consumida por catalog-service (no por el gateway): el CSV identifica al
  // docente por correo, pero las grabaciones se guardan con teacher_id, y los
  // usuarios viven en esta base. Es tráfico gRPC entre microservicios.
  rpc ResolveTeachersByEmail (ResolveTeachersRequest) returns (JsonResponse);

  // Consumida por catalog-service al publicar una grabación: necesita avisar a
  // los estudiantes inscritos, pero solo conoce sus student_id — los correos
  // viven en esta base.
  rpc ResolveStudentEmails   (StudentIdsRequest)     returns (JsonResponse);
}

message Empty {}
message MessageResponse { string message = 1; }

// Filas de vw_users_with_role (auth_db.sql) viajan serializadas como JSON: la vista tiene
// columnas variables y no vale la pena mantener un mensaje .proto en paralelo a cada ALTER de la vista.
message JsonResponse { string json = 1; }

message RegisterRequest {
  string email     = 1;
  string password  = 2;
  string full_name = 3;
}

message LoginRequest {
  string email    = 1;
  string password = 2;
}

message LoginResponse {
  string token = 1;
  string role  = 2;
  string email = 3;
}

message LogoutRequest { string token = 1; }

message GetUserByIdRequest { int32 id = 1; }

message AssignRoleRequest {
  int32 user_id  = 1;
  int32 role_id  = 2;
  int32 admin_id = 3;
}

message ToggleBlockRequest {
  int32 user_id = 1;
  bool  blocked = 2;
}

// Se resuelven todos los correos del archivo de una sola vez, no uno por fila:
// un CSV de N filas provoca una única llamada gRPC, no N.
message ResolveTeachersRequest { repeated string emails = 1; }

// Se resuelven todos los ids de una vez y no uno por estudiante: un curso con
// cien inscritos provoca una única llamada gRPC, no cien.
message StudentIdsRequest { repeated int32 student_ids = 1; }
