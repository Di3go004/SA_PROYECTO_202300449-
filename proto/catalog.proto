syntax = "proto3";
package catalog;
option go_package = "./proto";

// Contrato gRPC unificado del microservicio de Catálogo/Inscripciones (TypeScript/NestJS).
// Único consumidor: api-gateway, que ya validó el JWT y reenvía la identidad del usuario
// como campos explícitos del request (gRPC no tiene sesión implícita).
service CatalogService {
  rpc GetCatalog       (GetCatalogRequest)      returns (JsonResponse);
  rpc GetSchools       (Empty)                  returns (JsonResponse);
  rpc GetCourses       (GetCoursesRequest)       returns (JsonResponse);
  rpc GetRecordingById (GetRecordingByIdRequest) returns (JsonResponse);
  rpc EnrollStudent    (EnrollStudentRequest)    returns (MessageResponse);
  rpc UnenrollStudent  (UnenrollStudentRequest)  returns (MessageResponse);
  rpc GetMyCourses     (GetMyCoursesRequest)     returns (JsonResponse);

  // ── Panel administrativo (Práctica 3) ──────────────────────────────────
  // Reservadas a administrador/catedratico/auxiliar. Toda escritura se delega
  // a los SPs de practica3_sps.sql: el servicio no ejecuta INSERT/UPDATE/DELETE
  // sueltos sobre estas tablas.
  rpc ListSemesters      (Empty)                     returns (JsonResponse);
  rpc CreateSemester     (SemesterRequest)           returns (JsonResponse);
  rpc UpdateSemester     (SemesterRequest)           returns (MessageResponse);
  rpc DeleteSemester     (IdRequest)                 returns (MessageResponse);

  rpc ListSchools        (Empty)                     returns (JsonResponse);
  rpc CreateSchool       (SchoolRequest)             returns (JsonResponse);
  rpc UpdateSchool       (SchoolRequest)             returns (MessageResponse);
  rpc DeleteSchool       (IdRequest)                 returns (MessageResponse);

  rpc ListCourses        (ListCoursesRequest)        returns (JsonResponse);
  rpc CreateCourse       (CourseRequest)             returns (JsonResponse);
  rpc UpdateCourse       (CourseRequest)             returns (MessageResponse);
  rpc DeleteCourse       (IdRequest)                 returns (MessageResponse);

  rpc ListCourseTeachers (IdRequest)                 returns (JsonResponse);
  rpc AssignTeacher      (TeacherAssignmentRequest)  returns (MessageResponse);
  rpc UnassignTeacher    (TeacherAssignmentRequest)  returns (MessageResponse);

  // Ingesta masiva. El archivo viaja como texto y se parsea acá dentro: el
  // gateway solo recibe el multipart y no interpreta el dominio.
  rpc BulkImportRecordings (BulkImportRequest) returns (JsonResponse);
  rpc ListImportBatches    (Empty)             returns (JsonResponse);
  rpc GetImportBatch       (IdRequest)         returns (JsonResponse);
}

message Empty {}
message MessageResponse { string message = 1; }

// Filas de vw_catalog / vw_student_catalog / vw_courses_with_teachers (catalog_db.sql)
// viajan serializadas como JSON por el mismo motivo que en auth.proto.
message JsonResponse { string json = 1; }

// Los identificadores viajan como int32 y no como string: son las claves que
// fn_get_catalog_paginated compara contra columnas INT. El 0 significa "sin
// filtro" (proto3 no distingue ausente de cero en escalares) y el servicio lo
// convierte a NULL antes de llamar a la función.
message GetCatalogRequest {
  int32  user_id       = 1;
  string role          = 2;
  string semester      = 3;   // nombre: agrupa el mismo periodo de todos los años
  int32  semester_id   = 4;   // periodo concreto (semestre + año)
  int32  year          = 5;
  int32  school_id     = 6;
  int32  course_id     = 7;
  int32  teacher_id    = 8;
  string tag           = 9;
  string search        = 10;
  int32  page          = 11;
  int32  limit         = 12;
}

message GetCoursesRequest { string school_id = 1; }

message GetRecordingByIdRequest {
  int32  id      = 1;
  int32  user_id = 2;
  string role    = 3;
}

message EnrollStudentRequest {
  int32 student_id = 1;
  int32 course_id  = 2;
  int32 admin_id   = 3;
}

message UnenrollStudentRequest {
  int32 student_id = 1;
  int32 course_id  = 2;
}

message GetMyCoursesRequest { int32 student_id = 1; }

// ── Mensajes del panel administrativo ────────────────────────────────────
// En creación el campo id viaja en 0 (proto3 no distingue "ausente" de "cero"
// en escalares): el servicio nunca lo lee en los Create*, solo en los Update*.

message IdRequest { int32 id = 1; }

message SemesterRequest {
  int32  id        = 1;
  string name      = 2;
  int32  year      = 3;
  string code      = 4;  // vacío ⇒ lo deriva fn_build_semester_code
  bool   is_active = 5;
}

message SchoolRequest {
  int32  id   = 1;
  string name = 2;
  string code = 3;
}

message CourseRequest {
  int32  id          = 1;
  string name        = 2;
  string code        = 3;
  int32  school_id   = 4;
  int32  semester_id = 5;
}

// Filtros opcionales del listado administrativo: 0 significa "sin filtro".
message ListCoursesRequest {
  int32 school_id   = 1;
  int32 semester_id = 2;
}

message TeacherAssignmentRequest {
  int32 teacher_id = 1;
  int32 course_id  = 2;
}

// El id de quien sube el archivo NO viaja en el request: se toma del JWT que ya
// validó el guard, para que nadie pueda atribuir una carga a otro usuario.
message BulkImportRequest {
  string filename    = 1;
  string csv_content = 2;
}
