# frontend/nginx.conf
# Configuración para servir el cliente web compilado.
#
# Nota sobre add_header: nginx NO hereda las cabeceras de un bloque padre en un
# `location` que declara las suyas propias. Por eso las de seguridad se repiten
# en cada bloque en lugar de definirse una sola vez a nivel `server`: puestas
# arriba se perderían justo en las respuestas que importan.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;

    # ── Enrutado del lado del cliente ────────────────────────
    # React Router resuelve /catalog, /admin o /player/:id en el navegador, pero
    # esas rutas no existen como archivos. Sin este try_files, recargar la página
    # en cualquier ruta que no sea la raíz devolvería 404: nginx buscaría un
    # archivo llamado "catalog" y no lo encontraría.
    location / {
        try_files $uri $uri/ /index.html;

        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # ── Activos con huella en el nombre ──────────────────────
    # Vite incluye un hash en el nombre de cada bundle, así que un archivo dado
    # nunca cambia de contenido: se puede cachear indefinidamente. Al desplegar
    # una versión nueva cambian los nombres y el navegador los pide de nuevo.
    location /assets/ {
        access_log off;

        add_header Cache-Control "public, max-age=31536000, immutable" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }

    # index.html NO se cachea: es lo que apunta a los bundles con hash. Si el
    # navegador lo sirviera desde caché seguiría cargando la versión anterior
    # aunque el despliegue haya terminado.
    #
    # Se usa solo add_header y no `expires`: las dos directivas juntas emiten dos
    # cabeceras Cache-Control contradictorias en la misma respuesta.
    location = /index.html {
        add_header Cache-Control "no-store, must-revalidate" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    }
}
