# media/nginx.conf
# Servidor de medios del entorno local. En producción esto lo haría un CDN o un
# bucket de objetos; acá basta un nginx estático para que el reproductor tenga
# archivos reales que servir sin depender de internet durante la demo.
server {
    listen 80;
    server_name localhost;

    location / {
        root /usr/share/nginx/media;

        # Los add_header van declarados en ESTE bloque y no en el server: nginx
        # no hereda las cabeceras de un bloque padre si el hijo declara al menos
        # un add_header propio, así que definirlas arriba las perdía justo en la
        # respuesta del video.

        # El frontend corre en otro origen (5173), así que sin CORS el navegador
        # bloquea la reproducción.
        add_header Access-Control-Allow-Origin  "*" always;
        add_header Access-Control-Allow-Methods "GET, HEAD, OPTIONS" always;
        add_header Access-Control-Allow-Headers "Range" always;
        # Sin exponer estas cabeceras el reproductor no puede posicionarse en un
        # segundo concreto, que es justo lo que necesitan los checkpoints.
        add_header Access-Control-Expose-Headers "Content-Length, Content-Range, Accept-Ranges" always;
        # No se declara Accept-Ranges: nginx ya lo emite por su cuenta al servir
        # ficheros estáticos, y añadirlo acá lo duplicaba en cada respuesta.

        if ($request_method = OPTIONS) {
            return 204;
        }
    }

    location = /health {
        access_log off;
        add_header Content-Type application/json;
        return 200 '{"status":"ok","service":"media"}';
    }
}
